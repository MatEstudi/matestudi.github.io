<!--
REGLAS RECOMENDADAS (Firebase Console)
Authentication > Método de acceso: activar "Anónimo" y "Correo electrónico/contraseña" (las cuentas usan un correo interno <nombre>@mathstudy.app).
Firestore:
  match /databases/{db}/documents { match /users/{uid} {
    function ok() { return request.resource.data.nickname is string && (request.resource.data.nickname == '' || (request.resource.data.nickname.size() >= 3 && request.resource.data.nickname.size() <= 20 && request.resource.data.nickname.matches('^[A-Za-z0-9ÀÁÂÃÄÅÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜÝàáâãäåçèéêëìíîïñòóôõöùúûüýÿ]+( [A-Za-z0-9ÀÁÂÃÄÅÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜÝàáâãäåçèéêëìíîïñòóôõöùúûüýÿ]+)*$')))
      && request.resource.data.todaySeconds <= 86400 && request.resource.data.totalSeconds >= 0; }
    allow read: if request.auth != null;
    allow create: if request.auth.uid == uid && ok() && request.resource.data.estaVerificado == false;
    allow update: if request.auth.uid == uid && ok()
      && request.resource.data.get('estaVerificado', false) == resource.data.get('estaVerificado', false);
    allow delete: if request.auth.uid == uid; }
    match /progress/{uid} {
      allow read: if request.auth != null && request.auth.uid == uid;
      allow write: if request.auth != null && request.auth.uid == uid && request.resource.data.data is string && request.resource.data.data.size() < 500000; } }
  (Para verificar a alguien: Firebase Console > Firestore > users > documento de esa persona > estaVerificado = true.
   Ningun usuario puede cambiar ese campo desde la app: las reglas lo bloquean.)
Realtime Database (publica estas reglas en Realtime Database > Reglas; son JSON válido):
  {
    "rules": {
      "presence": {
        ".read": "auth!=null",
        ".indexOn": [
          "lastSeen"
        ],
        "$uid": {
          ".write": "auth!=null && (auth.uid===$uid || (data.exists() && !newData.exists() && data.child('lastSeen').val() < now-2592000000))",
          "online": {
            ".validate": "newData.isBoolean()"
          },
          "lastSeen": {
            ".validate": "newData.isNumber()"
          },
          "since": {
            ".validate": "newData.isNumber()"
          },
          "nickname": {
            ".validate": "newData.isString() && newData.val().length>=3 && newData.val().length<=20 && newData.val().matches(/^[A-Za-z0-9ÀÁÂÃÄÅÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜÝàáâãäåçèéêëìíîïñòóôõöùúûüýÿ]+( [A-Za-z0-9ÀÁÂÃÄÅÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜÝàáâãäåçèéêëìíîïñòóôõöùúûüýÿ]+)*$/)"
          },
          "avatarColor": {
            ".validate": "newData.isString() && newData.val().length<=7"
          },
          "active": {
            ".validate": "newData.isString() && newData.val().length<=30"
          },
          "$other": {
            ".validate": false
          }
        }
      },
      "cheers": {
        ".read": "auth!=null",
        "$target": {
          "$from": {
            ".write": "auth!=null && auth.uid===$from && auth.token.firebase.sign_in_provider!=='anonymous'",
            ".validate": "newData.isString() && newData.val().matches(/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/)"
          }
        }
      },
      "nicks": {
        "$key": {
          ".read": "auth!=null",
          ".write": "auth!=null && ((newData.exists() && newData.child('uid').val()===auth.uid && (!data.exists() || data.child('uid').val()===auth.uid || data.child('ts').val() < now-2592000000)) || (!newData.exists() && data.child('uid').val()===auth.uid))",
          ".validate": "$key.matches(/^[a-z0-9]{3,20}$/) && newData.hasChildren(['uid','nick','ts']) && newData.child('nick').isString() && newData.child('nick').val().length<=20 && newData.child('ts').val()===now",
          "uid": { ".validate": "newData.val()===auth.uid" },
          "nick": { ".validate": true },
          "ts": { ".validate": true },
          "$other": { ".validate": false }
        }
      },
      "chat": {
        "general": {
          ".read": "auth!=null",
          ".indexOn": [
            "ts"
          ],
          "$id": {
            ".write": "auth!=null && ((!data.exists() && newData.child('uid').val()===auth.uid) || (data.exists() && !newData.exists() && (data.child('uid').val()===auth.uid || data.child('ts').val() < now-604800000)))",
            ".validate": "newData.hasChildren(['uid','nick','text','ts','color']) && newData.child('text').isString() && newData.child('text').val().length>0 && newData.child('text').val().length<=300 && newData.child('nick').isString() && newData.child('nick').val().length>=3 && newData.child('nick').val().length<=20 && newData.child('nick').val().matches(/^[A-Za-z0-9ÀÁÂÃÄÅÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜÝàáâãäåçèéêëìíîïñòóôõöùúûüýÿ]+( [A-Za-z0-9ÀÁÂÃÄÅÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜÝàáâãäåçèéêëìíîïñòóôõöùúûüýÿ]+)*$/) && newData.child('color').isString() && newData.child('color').val().length<=7 && newData.child('ts').val()===now",
            "uid": {
              ".validate": true
            },
            "nick": {
              ".validate": true
            },
            "text": {
              ".validate": true
            },
            "ts": {
              ".validate": true
            },
            "color": {
              ".validate": true
            },
            "$other": {
              ".validate": false
            }
          }
        }
      }
    }
  }

<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#161a2e;--mut:#6b7190;--line:#e6e8f0;--acc:#6366f1;--soft:color-mix(in srgb,var(--acc) 11%,transparent);--r:22px;
--f1:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;--f2:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
:root[data-t=dark]{--bg:#0d1020;--card:#161a2e;--ink:#eceefb;--mut:#9096b5;--line:#252a45}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font:15px/1.5 var(--f2);color:var(--ink);background:radial-gradient(900px 420px at 50% -120px,var(--soft),transparent),var(--bg);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);transition:background .4s}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 60px}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px}
.logo{font:700 20px var(--f1);display:flex;gap:10px;align-items:center}
.logo i{width:30px;height:30px;border-radius:10px;background:var(--acc);color:#fff;display:grid;place-items:center;font-style:normal;transition:background .4s}
.tools{display:flex;gap:8px;align-items:center}
.ib{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:16px}
.me{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:500}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 13px var(--f1);flex:none;position:relative}
.av.on::after{content:'';position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#22c55e;border:2px solid var(--card)}
nav{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin:8px 0 22px}
nav button{flex:1;padding:9px;border-radius:12px;font-weight:600;color:var(--mut);transition:.2s}
nav button.on{background:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);font-weight:500;display:flex;gap:8px;align-items:center;transition:.2s}
.chip b{width:9px;height:9px;border-radius:50%}
.chip.on{background:var(--soft);border-color:var(--acc)}
.focus{text-align:center;padding:30px 22px 26px}
.ring{position:relative;width:min(300px,74vw);aspect-ratio:1;margin:22px auto 8px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .tr{stroke:var(--line)}.ring .pg{stroke:var(--acc);transition:stroke-dashoffset 1s linear,stroke .4s}
.clock{position:absolute;inset:0;display:grid;place-content:center;gap:2px}
.clock b{font:700 clamp(44px,13vw,62px)/1 var(--f1);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock span{color:var(--mut);font-size:13px}
.ctl{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:14px}
.go{padding:14px 34px;border-radius:99px;background:var(--acc);color:#fff;font:600 16px var(--f2);transition:transform .15s,background .4s}
.go:active{transform:scale(.96)}
.sec{padding:14px 18px;border-radius:99px;border:1px solid var(--line);font-weight:500;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;margin-top:18px}
.seg button{padding:6px 14px;border-radius:99px;color:var(--mut);font-size:13px;font-weight:500}
.seg button.on{background:var(--soft);color:var(--ink)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.st{padding:16px}.st b{display:block;font:700 24px var(--f1)}.st span{color:var(--mut);font-size:13px}
.bar{height:7px;border-radius:9px;background:var(--line);margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .5s}
h2{font:700 18px var(--f1);margin:26px 0 12px}
.week{display:flex;gap:8px;align-items:flex-end;height:110px}
.week div{flex:1;text-align:center;font-size:12px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:6px}
.week div{min-width:0}
.week div.td{color:var(--ink);font-weight:700}
.week i{display:block;background:var(--acc);border-radius:8px;min-height:4px;opacity:.85}
.list{display:grid;gap:10px}
.m{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.m.me1{border-color:var(--acc)}
.m .n{flex:1;min-width:0}.m .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m small{color:var(--mut)}.m .t{font:700 16px var(--f1);text-align:right}.pos{width:26px;text-align:center;font:700 15px var(--f1);color:var(--mut)}
.live{color:#16a34a}
.empty{text-align:center;color:var(--mut);padding:34px 10px}
.add{display:flex;gap:8px;margin-top:12px}
input[type=text],input[type=number],input[type=password],textarea{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg)}
.mini{padding:11px 18px;border-radius:14px;background:var(--acc);color:#fff;font-weight:600}
dialog{border:0;border-radius:var(--r);padding:24px;width:min(420px,92vw);background:var(--card);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,10,24,.55);backdrop-filter:blur(3px)}
dialog label{display:block;margin:14px 0 6px;font-weight:600;font-size:14px}
.cols{display:flex;gap:8px;flex-wrap:wrap}.cols button{width:30px;height:30px;border-radius:50%;border:3px solid transparent}.cols button.on{border-color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.acct{padding:14px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}
.acct .acts{margin-top:12px}
.ghost{padding:10px 14px;border-radius:12px;border:1px solid var(--line);font-weight:500}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;z-index:9;font-weight:500;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
.hint{color:var(--mut);font-size:13px;text-align:center;margin-top:10px}
nav button{font-size:14px}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.goal b{font:700 22px var(--f1)}.goal small{display:block;color:var(--mut);margin-top:8px;min-height:38px}
.goal label{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--mut)}.goal input{width:70px;padding:6px 10px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dist{display:grid;gap:14px}.dist div div{display:flex;justify-content:space-between;font-weight:500}.dist small{color:var(--mut)}
.hd{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}.hd h2{margin:0}.hd .seg{margin:0}
.ses{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.ses:last-child{border:0}.ses small{color:var(--mut)}
.fc{padding:16px;margin-bottom:10px}.fc.me1{border-color:var(--acc)}
.m0{display:flex;gap:12px;align-items:center}.m0 .n{flex:1;min-width:0}.m0 .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.el{font:700 20px var(--f1);color:#16a34a;font-variant-numeric:tabular-nums}
.m0 small{display:block;color:var(--mut)}.m0 small.live{color:#16a34a}
.fs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.fs b{display:block;font:700 15px var(--f1)}.fs span{color:var(--mut);font-size:12px}
.gh{font:700 15px var(--f1);color:var(--mut);margin:20px 0 10px}
.bd{display:inline-block;min-width:18px;padding:0 5px;border-radius:99px;background:#22c55e;color:#fff;font-size:11px;line-height:18px;margin-left:4px}
.chat{display:flex;flex-direction:column;height:min(62vh,560px);min-height:320px;padding:0}
.cl{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:16px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:86%}.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.msg .av{width:26px;height:26px;font-size:12px}
.bb{background:var(--bg);border-radius:16px;padding:8px 12px;min-width:0}.mine .bb{background:var(--acc);color:#fff}
.bb small{display:block;font-size:11px;color:var(--mut)}.mine .bb small{color:rgba(255,255,255,.8)}
.bb p{white-space:pre-wrap;word-break:break-word}
.lk{font-size:11px;color:inherit;opacity:.75;text-decoration:underline;margin-left:6px}
.cin{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
@media(max-width:480px){.goals{grid-template-columns:1fr}}
@media(max-width:480px){.row{grid-template-columns:1fr 1fr}.row .st:first-child{grid-column:span 2}.me span{display:none}.me{padding:4px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.vt{width:15px;height:15px;vertical-align:-2px;margin-left:4px;flex:none}

/* ---------- Rachas (fuego) ---------- */
.fl{width:1em;height:1em;vertical-align:-.15em;flex:none;display:inline-block}
.fl.off{filter:grayscale(1);opacity:.45}
.stk{display:inline-flex;align-items:center;gap:3px;padding:3px 9px 3px 6px;border-radius:99px;background:rgba(249,115,22,.14);color:#ea580c;font:700 13px var(--f1);flex:none;font-variant-numeric:tabular-nums}
:root[data-t=dark] .stk{color:#fb923c}
.fire{position:relative;overflow:hidden}
.fire>*{position:relative;z-index:1}
.fire>.bgf{position:absolute;z-index:0;right:-14px;top:50%;width:auto;height:170%;aspect-ratio:1;transform:translateY(-50%) rotate(8deg);opacity:var(--fo,.12);pointer-events:none}
.stn{color:var(--mut);font-size:12px;margin-top:6px;line-height:1.35}
.fire.fb{border-color:color-mix(in srgb,#f97316 calc(var(--fl,0)*100%),var(--line));box-shadow:0 0 0 calc(var(--fl,0)*1.5px) color-mix(in srgb,#f97316 calc(var(--fl,0)*100%),transparent),0 0 calc(var(--fl,0)*22px) calc(var(--fl,0)*2px) rgba(249,115,22,calc(.12 + var(--fl,0)*.4))}
.fire.max{animation:flick 1.6s ease-in-out infinite alternate}
@keyframes flick{to{box-shadow:0 0 0 1.5px #f97316,0 0 30px 5px rgba(251,146,60,.7)}}
@media(prefers-reduced-motion:reduce){.fire.max{animation:none}}

/* ---------- Tren de Anàlisi ---------- */
.train{padding:16px 14px 14px;margin-bottom:10px;overflow-x:auto;overflow-y:hidden;border-color:#f43f5e55}
.train h3{font:700 13px var(--f1);color:var(--mut);display:flex;justify-content:space-between;gap:8px}
.trk{display:flex;align-items:flex-end;width:max-content;min-width:100%;padding:58px 4px 10px;position:relative}
.trk::before{content:'';position:absolute;left:0;right:0;bottom:8px;height:3px;background:var(--mut);opacity:.7;border-radius:2px}
.trk::after{content:'';position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(90deg,#92400e 0 9px,transparent 9px 24px);opacity:.55;animation:gnd .45s linear infinite}
@keyframes gnd{to{background-position-x:-24px}}
.car{position:relative;width:112px;height:128px;flex:none;margin-right:10px;animation:bob .5s ease-in-out infinite alternate;animation-delay:calc(var(--i,0)*-.17s)}
.car:first-child{margin-left:auto}
@keyframes bob{to{transform:translateY(-1.5px)}}
.car:not(.loco)::after{content:'';position:absolute;right:-10px;top:96px;width:10px;height:5px;background:#475569;border-radius:2px}
.cb{position:absolute;left:0;right:0;top:0;height:110px;background:#f43f5e;border-radius:10px 10px 4px 4px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.16)}
.cb::before,.cab::before{content:'';position:absolute;left:-3px;right:-3px;top:-5px;height:9px;border-radius:6px;background:#9f1239}
.cb::after,.cab::after{content:'';position:absolute;left:0;right:0;bottom:18px;height:4px;background:rgba(255,255,255,.45)}
.cw{position:absolute;left:8px;right:8px;top:14px;bottom:24px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.55);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#fff;text-align:center;z-index:1}
.cw .av{width:32px;height:32px;font-size:14px;border:2px solid #fff;overflow:visible}
.cw .av::after{display:none}
.cw b{font:700 12px var(--f1);max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center}
.cw .vt{width:12px;height:12px}
.cw .el{color:#fff;font-size:12px;line-height:1.2}
.cw small{font-size:10px;line-height:1.2;opacity:.92}
.ch{position:absolute;left:4px;right:4px;top:108px;height:8px;background:#1e293b;border-radius:3px}
.wl{position:absolute;bottom:0;width:24px;height:24px;animation:spin .9s linear infinite;will-change:transform}
.w1{left:12px}.w2{right:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loco{width:210px}
.loco .ch{right:16px}
.cab{position:absolute;left:0;top:0;width:90px;height:110px;background:#be123c;border-radius:8px 4px 4px 4px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.18)}
.cab .cw{top:20px;bottom:14px}
.boiler{position:absolute;left:86px;top:40px;width:104px;height:62px;border-radius:4px 30px 30px 4px;background:repeating-linear-gradient(90deg,transparent 0 30px,rgba(0,0,0,.22) 30px 33px),linear-gradient(#e11d48,#9f1239);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.chim{position:absolute;left:150px;top:16px;width:18px;height:28px;background:#1e293b}
.chim::before{content:'';position:absolute;left:-4px;right:-4px;top:-5px;height:7px;border-radius:3px;background:#1e293b}
.dome{position:absolute;left:108px;top:28px;width:22px;height:16px;background:#fbbf24;border-radius:11px 11px 0 0}
.lamp{position:absolute;left:188px;top:56px;width:10px;height:14px;background:#fde047;border-radius:0 8px 8px 0;box-shadow:0 0 12px #fde047}
.catch{position:absolute;left:180px;top:100px;width:30px;height:24px;background:#1e293b;clip-path:polygon(0 0,100% 100%,0 100%)}
.loco .wl{width:34px;height:34px}

function clean(p){
  const b=blank(),o=p&&typeof p==='object'?p:{};

  b.sel=IDS.includes(o.sel)?o.sel:'fonaments';b.range=o.range===30?30:7;b.mode=o.mode==='pomo'?'pomo':'free';

  const h=o.hist??o.dailyHistory;
  if(h&&typeof h==='object')Object.keys(h).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).forEach(k=>{
    const e={t:0};IDS.forEach(i=>{e[i]=num(h[k]?.[i],86400);e.t+=e[i]});if(e.t)b.hist[k]=e});
  const wk=o.wk;if(wk&&typeof wk==='object')Object.keys(wk).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort().slice(-12).forEach(k=>{const v=wk[k]||{},h=(Array.isArray(v.h)?v.h:[]).slice(0,24).map(n=>num(n,86400));while(h.length<24)h.push(0);
    const l=v.l&&IDS.includes(v.l.s)&&num(v.l.d,86400)>0?{d:num(v.l.d,86400),s:v.l.s}:null;b.wk[k]={h,f:num(v.f,604800),p:num(v.p,604800),l}});
  const ws=o.ws;if(ws&&typeof ws==='object')Object.keys(ws).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&ws[k]).sort().slice(-12).forEach(k=>{b.ws[k]=1});
  b.sess=(Array.isArray(o.sess??o.sessions)?(o.sess??o.sessions):[]).map(x=>({s:x.s??x.subjectId,d:num(x.d??x.durationSeconds,86400),at:x.at??(Date.parse(x.dateISO)||0),n:String(x.n??x.note??'').slice(0,60)})).filter(x=>IDS.includes(x.s)&&x.d>0).slice(0,50);

}

function addTime(id,d){
  S.tot[id]+=d;const k=dk(),e=S.hist[k]||(S.hist[k]={t:0,fonaments:0,algebra:0,analisi:0,otros:0});e[id]+=d;e.t+=d;

  const now=Date.now(),d=Math.floor((now-last)/1000);if(d<1||!S.run)return;last+=d*1000;

  paint();if(++tick5%30===0)sync();save();

/* Racha: un día suma si se estudia al menos 1 hora (QUAL). Si hoy aún no llegas a 1 h, la racha no se pierde: cuenta hasta ayer. */
const QUAL=3600,dias=n=>n+(n===1?' día':' días');

  let n=0;const d=lnow();if(day(dk(d))<QUAL)d.setDate(d.getDate()-1);

function streakBest(cur){
  let best=0,run=0,prev=null;
  Object.keys(S.hist).filter(k=>S.hist[k].t>=QUAL).sort().forEach(k=>{
    const[y,m,d]=k.split('-').map(Number),t=Date.UTC(y,m-1,d);
    run=prev!==null&&t-prev===864e5?run+1:1;prev=t;if(run>best)best=run});

}

/* Fusión segura del progreso: el tiempo solo crece, así que se queda el máximo de cada campo.
   Evita que un dispositivo con datos viejos pise lo que otro ya guardó. */
function mergeProg(a,b){
  const r={tot:{},hist:{},wk:{},ws:{}};
  IDS.forEach(i=>r.tot[i]=Math.max(a.tot[i]||0,b.tot[i]||0));
  new Set([...Object.keys(a.hist),...Object.keys(b.hist)]).forEach(k=>{
    const x=a.hist[k]||{},y=b.hist[k]||{},e={t:0};IDS.forEach(i=>{e[i]=Math.max(x[i]||0,y[i]||0);e.t+=e[i]});if(e.t)r.hist[k]=e});
  const wa=a.wk||{},wb=b.wk||{};
  new Set([...Object.keys(wa),...Object.keys(wb)]).forEach(k=>{const x=wa[k],y=wb[k];r.wk[k]=(!y||(x&&x.f+x.p>=y.f+y.p))?x:y});
  Object.keys(r.wk).sort().slice(0,-12).forEach(k=>delete r.wk[k]);
  r.ws={...(a.ws||{}),...(b.ws||{})};Object.keys(r.ws).sort().slice(0,-12).forEach(k=>delete r.ws[k]);
  const seen=new Set();
  r.sess=[...a.sess,...b.sess].filter(x=>{const q=x.at+'|'+x.s+'|'+x.d;if(seen.has(q))return false;seen.add(q);return true}).sort((p,q)=>q.at-p.at).slice(0,50);
  return r;
}
/* Progreso en la nube: como mucho una escritura cada 5 min mientras estudias, y al instante al pausar, terminar o cambiar ajustes. */
let pgQ=Promise.resolve(),lastPg='',lastPgAt=0;
const progOf=()=>JSON.stringify({tot:S.tot,hist:S.hist,sess:S.sess,wk:S.wk,ws:S.ws,goalD:S.goalD,goalW:S.goalW,nick:S.nick,color:S.color});

async function pushProg(force){

  const now=Date.now();
  if(!force&&now-lastPgAt<3e5)return true;
  if(!force&&progOf()===lastPg)return true;
  lastPgAt=now;
  try{
    const ref=fb.db.collection('progress').doc(fb.uid),sn=await ref.get();let cs='';
    if(sn.exists){
      cs=String(sn.data().data||'');
      let c=null;try{c=clean(JSON.parse(cs))}catch(e){}
      const cr=Math.max(0,Math.floor(Number(sn.data().rev))||0);
      if(c&&cr>(S.rev||0)){ /* ajuste manual desde la consola: la nube manda, se sustituye lo local */
        S.tot=c.tot;S.hist=c.hist;S.sess=c.sess;S.wk=c.wk;S.ws={...S.ws,...c.ws};S.rev=cr;stop();render()}
      else if(c){const m=mergeProg(S,c);S.tot=m.tot;S.hist=m.hist;S.sess=m.sess;S.wk=m.wk;S.ws=m.ws;
        if(!S.nick){S.nick=c.nick;S.color=c.color;S.goalD=c.goalD;S.goalW=c.goalW}}

    lastPg=js;save(true);return true;
  }catch(e){console.warn('Progreso:',e.code||e.message);return false}

      daily:(u.todayDateKey===tk?num(u.todaySeconds,86400):0)+extra,weekly:(u.weekStartKey===wk?num(u.weeklySeconds):0)+extra,total:num(u.totalSeconds)+extra,

  return h+'</div><div class="hint">El Wrapped se desbloquea cada viernes a las 13:50 y cuenta de sábado a viernes.'+(C?' Los datos de la comunidad se actualizan cuando cada persona pausa el cronómetro o cierra la app.':'')+'</div>';
}

/* ---------- Mates Wrapped: modo tarjetas. La primera vez que se ve una semana salen una a una y al final queda el resumen completo ---------- */
let wrapLast=null,stOpen=false,stI=0,stSl=[],stK='',stLabel='';
function openStory(){
  if(stOpen||!wrapLast)return;
  const t=document.createElement('div');t.innerHTML=wrapLast.html;
  const cards=[...(t.firstElementChild?t.firstElementChild.children:[])].map(c=>c.outerHTML);
  if(!cards.length)return;
  stLabel=wrapLast.label;stK=wrapLast.k;stI=0;stOpen=true;
  stSl=[`<div class="card wc hero" style="text-align:center;padding:38px 24px"><span class="em">✨</span><small class="k" style="padding:0">Mates Wrapped</small><div class="big" style="font-size:30px;margin:10px 0 8px">Tu semana tiene algo que contarte</div><div class="cap">${esc(stLabel)}</div></div>`,...cards];
  const v=document.createElement('div');v.className='stv';v.id='stv';v.setAttribute('role','dialog');v.setAttribute('aria-modal','true');v.setAttribute('aria-label','Mates Wrapped');
  document.body.appendChild(v);document.body.style.overflow='hidden';
  stDraw();
}
function stDraw(){
  const v=$('#stv');if(!v)return;const last=stI===stSl.length-1;
  v.innerHTML=`<div class="stp">${stSl.map((_,i)=>`<i class="${i<=stI?'on':''}"></i>`).join('')}</div>
  <div class="stt"><span>${esc(stLabel)}</span><button type="button" data-stx="1">${last?'Cerrar':'Saltar'}</button></div>
  <div class="sts" data-stnext="1"><div class="stc">${stSl[stI]}</div></div>
  <div class="stn">${stI?'<button type="button" class="ghost" data-stprev="1" aria-label="Tarjeta anterior">‹</button>':''}<button type="button" class="mini" id="stnb" data-stnext="1">${stI===0?'Empezar':last?'Ver resumen':'Siguiente'}</button></div>`;
  const b=$('#stnb');if(b)b.focus({preventScroll:true});
}
function stNext(){stI<stSl.length-1?(stI++,stDraw()):stClose()}
function stClose(){
  const v=$('#stv');if(v)v.remove();
  document.body.style.overflow='';stOpen=false;wrapReveal=false;
  if(stK){S.ws=S.ws||{};if(!S.ws[stK]){S.ws[stK]=1;Object.keys(S.ws).sort().slice(0,-12).forEach(k=>delete S.ws[k]);save(true);syncProgress(true)}}
  render();scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const t=e.target;if(!stOpen||!t.closest||!t.closest('#stv'))return;
  if(t.closest('[data-stprev]')){if(stI>0){stI--;stDraw()}return}
  if(t.closest('[data-stx]'))return stClose();
  if(t.closest('[data-stnext]'))stNext();
});
document.addEventListener('keydown',e=>{
  if(!stOpen)return;
  if(e.key==='ArrowRight')stNext();
  else if(e.key==='ArrowLeft'){if(stI>0){stI--;stDraw()}}
  else if(e.key==='Escape'){e.preventDefault();stClose()}
});

function group(){
  const ms=members();let h=`<div class="seg gseg" style="margin:0 0 14px"><button data-gv="friends" class="${S.gv==='friends'?'on':''}">Amigos</button><button data-gv="rank" class="${S.gv==='rank'?'on':''}">Ranking</button><button data-gv="chat" class="${S.gv==='chat'?'on':''}">Chat</button><button data-gv="wrap" class="${S.gv==='wrap'?'on':''}">Mates Wrapped</button></div>`;
  if(S.gv==='wrap')return h+wrapView();
  if(!S.nick)h+=`<div class="card" style="margin-bottom:14px;text-align:center">Crea una cuenta para aparecer en la comunidad: tu nombre de usuario será tu nombre en el ranking.<div class="ctl"><button class="mini" data-reg="1">Crear cuenta</button></div></div>`;
  if(!fb.ok)h+=`<div class="hint" style="margin-bottom:10px">Sin conexión: la comunidad no está disponible, pero tu cronómetro funciona igual.</div>`;
  if(S.gv==='chat')return h+chatView();
  if(S.gv==='friends'){
    const by=(a,k)=>a.sort((x,y)=>y[k]-x[k]),act=by(ms.filter(m=>m.act),'daily'),onl=by(ms.filter(m=>m.on&&!m.act),'daily'),off=by(ms.filter(m=>!m.on),'seen');
    const sec=(t,a,x='')=>a.length?`<div class="gh">${t} (${a.length})</div>`+x+a.filter(m=>!(m.act===SUBJ.analisi.n&&x)).map(friend).join(''):'';
    h+=sec('Estudiando ahora',act,trainBlock(act,ms))+sec('En línea',onl)+sec('Desconectados',off);
    if(ms.filter(m=>!m.me).length===0)h+=`<div class="empty">Aún no hay amigos aquí.<br>Comparte el enlace de la app: aparecerán en cuanto pongan su nombre.</div>`;
    return h;
  }
  const tabs=[['daily','Hoy'],['weekly','Semana'],['total','Total'],['streak','Racha']],sr=S.rank==='streak';
  ms.sort((a,b)=>sr?(b.streak-a.streak||b.best-a.best||b.total-a.total):b[S.rank]-a[S.rank]);
  h+=`<div class="seg" style="margin:0 0 14px">${tabs.map(([k,l])=>`<button data-rank="${k}" class="${S.rank===k?'on':''}">${l}</button>`).join('')}</div>`;
  h+=ms.length?`<div class="list">${ms.map((m,i)=>`<div class="m ${m.me?'me1':''}${fireCls(m.streak)}" style="${fireVar(m.streak)}">${fireBg(m.streak)}<div class="pos">${(!sr||m.streak>0)&&['🥇','🥈','🥉'][i]||i+1}</div>
  <div class="av ${m.on?'on':''}" style="background:${m.color}">${esc(m.nick[0].toUpperCase())}</div>
  <div class="n"><b>${esc(m.nick)}${isVer(m.id)?TICK:''}${rkT(m.total)}${m.me?' (tú)':''}</b><small class="${!sr&&m.act?'live':''}">${sr?'Récord: '+dias(m.best):m.act?'Estudiando '+esc(m.act):m.on?'En línea':'Visto '+ago(m.seen)}</small></div><div class="t">${sr?FL+' '+dias(m.streak):hm(m[S.rank])}</div></div>`).join('')}</div>${sr?'<div class="hint">Ranking por racha actual. Un día suma si estudias 1 h o más. El borde de fuego aparece en el día 5 y llega al máximo en el día 30.</div>':''}`
    :`<div class="empty">Todavía no hay nadie en el ranking.<br>Empieza a estudiar y serás el primero.</div>`;
  return h;
}
function hdr(){const e=$('#mename');if(e)e.innerHTML=esc(S.nick||'Tu nombre')+(S.nick&&isVer(fb.uid)?TICK:'')+(S.nick?rkT(stats().total):'')}
function render(){
  setAcc();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  $('#meav').textContent=S.nick?S.nick[0].toUpperCase():'?';$('#meav').style.background=S.color;hdr();
  badge();syncListeners();
  $('#main').innerHTML=S.view==='study'?study():S.view==='stats'?statsView():S.view==='more'?moreView():group();
  if(S.view==='study')paint();
  if(S.view==='group'&&S.gv==='friends')fixTrain();
  if(S.view==='group'&&S.gv==='chat'){const ci=$('#ci'),cl=$('#cl');if(ci)ci.value=draft;if(cl)cl.scrollTop=cl.scrollHeight}
}

/* ---------- Chat (Realtime Database; solo se escucha con el chat abierto; últimos 50 mensajes) ---------- */
let draft='',lastMsg=0,chatRef=null;
const hhmm=t=>{const d=new Date(t||Date.now());return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function bubble(m){
  const me=m.uid===fb.uid,col=COLORS.includes(m.color)?m.color:COLORS[0],nk=NICK_RE.test(String(m.nick))?String(m.nick):'Anónimo';
  return `<div class="msg ${me?'mine':''}" id="m_${esc(m.k)}"><div class="av" style="background:${col}">${esc(nk[0].toUpperCase())}</div>
  <div class="bb"><small>${me?'Tú':esc(nk)}${isVer(m.uid)?TICK:''}${rkT(me?stats().total:num(fb.users[m.uid]?.totalSeconds))} ${hhmm(m.ts)}${me?`<button class="lk" data-delm="${esc(m.k)}">borrar</button>`:''}</small><p>${esc(m.text)}</p></div></div>`;
}
function chatView(){
  const ms=fb.msgs||[];
  return `<div class="card chat"><div class="cl" id="cl">${ms.length?ms.map(bubble).join(''):'<div class="empty" id="ce">Aún no hay mensajes. Escribe el primero.</div>'}</div>
  <div class="cin"><input type="text" id="ci" maxlength="300" placeholder="Escribe un mensaje" autocomplete="off"><button class="mini" id="cs">Enviar</button></div></div>
  <div class="hint">Lo ven todos los usuarios de la app. Se muestran los últimos 50 mensajes.</div>`;
}
function chatAdd(m){
  const l=document.getElementById('cl');if(!l||S.view!=='group'||S.gv!=='chat')return;
  const near=l.scrollHeight-l.scrollTop-l.clientHeight<80||m.uid===fb.uid;
  document.getElementById('ce')?.remove();l.insertAdjacentHTML('beforeend',bubble(m));
  while(l.children.length>80)l.firstChild.remove();
  if(near)l.scrollTop=l.scrollHeight;
}
function listenChat(on){
  if(!fb.ok)return;
  if(on&&!chatRef){
    fb.msgs=[];chatRef=fb.rt.ref('chat/general').limitToLast(50);
    chatRef.on('child_added',x=>{const m={k:x.key,...x.val()};fb.msgs.push(m);if(fb.msgs.length>80)fb.msgs.shift();chatAdd(m)},e=>{console.warn('Chat:',e);chatRef=null});
    chatRef.on('child_removed',x=>{fb.msgs=fb.msgs.filter(m=>m.k!==x.key);document.getElementById('m_'+x.key)?.remove()});
  }else if(!on&&chatRef){chatRef.off();chatRef=null}
}
/* Limpieza sin servidor: una vez por visita se borran (máx. 50 de cada) los mensajes de más de 7 días y las presencias de más de 30. */
let pruned=false;
function prune(){
  if(!fb.ok||pruned)return;pruned=true;
  const run=(path,key,ms)=>fb.rt.ref(path).orderByChild(key).endAt(sNow()-ms-36e5).limitToFirst(50).once('value')
    .then(sn=>Promise.all(Object.keys(sn.val()||{}).filter(k=>path!=='presence'||k!==fb.uid).map(k=>fb.rt.ref(path+'/'+k).remove().catch(()=>{}))))
    .catch(e=>console.warn('Limpieza:',e.message));
  run('chat/general','ts',7*864e5);run('presence','lastSeen',30*864e5);
}
function syncListeners(){const g=S.view==='group'&&!document.hidden;if(g)fetchVerified();listenUsers(g&&S.gv!=='chat');listenChat(g&&S.gv==='chat');listenCheers(g&&S.gv==='friends')}
function sendMsg(){
  const i=$('#ci'),t=(i?i.value:'').trim().slice(0,300);
  if(!t)return;if(!S.nick)return settings();if(!fb.ok)return toast('Sin conexión con la comunidad');
  if(Date.now()-lastMsg<1500)return toast('Espera un segundo antes de enviar otro mensaje');
  lastMsg=Date.now();
  fb.rt.ref('chat/general').push({uid:fb.uid,nick:S.nick,color:S.color,text:t,ts:firebase.database.ServerValue.TIMESTAMP}).catch(()=>toast('No se pudo enviar. Revisa las reglas de Realtime Database.'));
  i.value='';draft='';
}

/* ---------- Ajustes ---------- */
function settings(){
  const d=$('#dlg'),acc=fb.acct;
  d.onkeydown=null;
  d.innerHTML=`<h2 style="margin-top:0">Perfil y ajustes</h2>
  <div class="acct">${acc
    ?`<b>Sesión iniciada</b><div class="hint" style="text-align:left;margin:2px 0 0">Tu progreso se guarda en tu cuenta y se restaura al entrar desde cualquier dispositivo.</div>
    <div class="acts"><button class="ghost" id="cpw">Cambiar contraseña</button><button class="ghost" id="lo">Cerrar sesión</button></div>`
    :`<b>Sin cuenta</b><div class="hint" style="text-align:left;margin:2px 0 0">Crea una cuenta para guardar tu progreso y recuperarlo en cualquier dispositivo.</div>
    <div class="acts"><button class="mini" id="reg">Crear cuenta</button><button class="ghost" id="log">Entrar</button></div>`}</div>
  ${S.nick?`<label for="pn">Nombre de usuario</label><input type="text" id="pn" value="${esc(S.nick)}" readonly><small style="display:block;color:var(--mut);margin-top:2px">${acc?'Es tu nombre en el ranking y el que usas para entrar. No se puede cambiar.':'Es tu nombre en el ranking.'}</small>`:`<div class="hint" style="text-align:left;margin-top:12px">Tu nombre en el ranking es tu nombre de usuario: crea una cuenta para aparecer en la comunidad.</div>`}
  <label>Color</label><div class="cols">${COLORS.map(c=>`<button type="button" data-col="${c}" class="${c===S.color?'on':''}" style="background:${c}" aria-label="Color ${c}"></button>`).join('')}</div>
  <label for="gd">Meta diaria (horas)</label><input type="number" id="gd" min="1" max="24" value="${S.goalD}">
  <label for="gw">Meta semanal (horas)</label><input type="number" id="gw" min="1" max="168" value="${S.goalW}">
  <div class="acts"><button class="mini" id="ok">Guardar</button><button class="ghost" id="dcl">Cerrar</button></div>`;
  d.open||d.showModal();
  let col=S.color;
  d.onclick=e=>{const c=e.target.closest('[data-col]');if(c){col=c.dataset.col;d.querySelectorAll('[data-col]').forEach(b=>b.classList.toggle('on',b===c))}};
  $('#dcl').onclick=()=>d.close();
  if(acc){$('#cpw').onclick=pwDlg;$('#lo').onclick=logout}
  else{$('#reg').onclick=()=>authDlg('reg');$('#log').onclick=()=>authDlg('log')}
  $('#ok').onclick=()=>{S.color=col;S.goalD=Math.min(24,num($('#gd').value)||3);S.goalW=Math.min(168,num($('#gw').value)||15);save(true);d.close();render();sync(true);toast('Guardado')};
}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target,q=s=>t.closest(s);let x;
  if((x=q('#nav button')))return S.view=x.dataset.v,render();
  if((x=q('[data-sub]'))){if(S.run)return toast('Pausa el cronómetro para cambiar de asignatura');S.sel=x.dataset.sub;save();return render()}
  if(q('#go'))return toggle();
  if(q('#fin'))return finish();
  if((x=q('[data-mode]'))){if(S.run)return toast('Pausa el cronómetro para cambiar de modo');S.mode=x.dataset.mode;S.cur=0;S.phase=0;S.rem=POMO[0];save();return render()}
  if((x=q('[data-range]')))return S.range=+x.dataset.range,save(),render();
  if((x=q('[data-cheer]')))return cheer(x.dataset.cheer);
  if((x=q('[data-wo]')))return wrapOff+=+x.dataset.wo,render();
  if(q('[data-wrep]'))return openStory();
  if((x=q('[data-gv]')))return S.gv=x.dataset.gv,render();
  if(q('#cs'))return sendMsg();
  if((x=q('[data-delm]')))return fb.ok&&fb.rt.ref('chat/general/'+x.dataset.delm).remove().catch(()=>toast('No se pudo borrar'));
  if((x=q('[data-rank]')))return S.rank=x.dataset.rank,render();
  if(q('[data-reg]'))return authDlg('reg');
  if(q('[data-open]')||q('#me'))return settings();
});
document.addEventListener('change',e=>{const g=e.target.id;if(g==='qd'||g==='qw'){const mx=g==='qd'?24:168,v=Math.min(mx,Math.max(1,num(e.target.value)||1));g==='qd'?S.goalD=v:S.goalW=v;save(true);return render()}
  });
document.addEventListener('input',e=>{if(e.target.id==='ci')draft=e.target.value;});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='ci')sendMsg()});
document.addEventListener('visibilitychange',()=>{if(S.run){last=Date.now()-Math.min(Date.now()-last,864e5)}});

setInterval(()=>{if(S.view==='group'&&S.gv!=='chat'&&!S.run)render()},15000); // refresca 'hace X min' aunque tu cronómetro esté parado
setInterval(()=>document.querySelectorAll('.el[data-s]').forEach(e=>e.textContent=clock((sNow()-e.dataset.s)/1000)),1000);
load();render();initFb();
</script>
</body>
</html>
