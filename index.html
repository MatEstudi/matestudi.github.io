      && request.resource.data.todaySeconds <= 86400 && request.resource.data.totalSeconds >= 0; }

    allow update: if request.auth.uid == uid && ok()

<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#161a2e;--mut:#6b7190;--line:#e6e8f0;--acc:#6366f1;--soft:color-mix(in srgb,var(--acc) 11%,transparent);--r:22px;
--f1:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;--f2:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
:root[data-t=dark]{--bg:#0d1020;--card:#161a2e;--ink:#eceefb;--mut:#9096b5;--line:#252a45}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font:15px/1.5 var(--f2);color:var(--ink);background:radial-gradient(900px 420px at 50% -120px,var(--soft),transparent),var(--bg);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);transition:background .4s}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 60px}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px}
.logo{font:700 20px var(--f1);display:flex;gap:10px;align-items:center}
.logo i{width:30px;height:30px;border-radius:10px;background:var(--acc);color:#fff;display:grid;place-items:center;font-style:normal;transition:background .4s}
.tools{display:flex;gap:8px;align-items:center}
.ib{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:16px}
.me{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:500}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 13px var(--f1);flex:none;position:relative}
.av.on::after{content:'';position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#22c55e;border:2px solid var(--card)}
nav{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin:8px 0 22px}
nav button{flex:1;padding:9px;border-radius:12px;font-weight:600;color:var(--mut);transition:.2s}
nav button.on{background:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);font-weight:500;display:flex;gap:8px;align-items:center;transition:.2s}
.chip b{width:9px;height:9px;border-radius:50%}
.chip.on{background:var(--soft);border-color:var(--acc)}
.focus{text-align:center;padding:30px 22px 26px}
.ring{position:relative;width:min(300px,74vw);aspect-ratio:1;margin:22px auto 8px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .tr{stroke:var(--line)}.ring .pg{stroke:var(--acc);transition:stroke-dashoffset 1s linear,stroke .4s}
.clock{position:absolute;inset:0;display:grid;place-content:center;gap:2px}
.clock b{font:700 clamp(44px,13vw,62px)/1 var(--f1);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock span{color:var(--mut);font-size:13px}
.ctl{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:14px}
.go{padding:14px 34px;border-radius:99px;background:var(--acc);color:#fff;font:600 16px var(--f2);transition:transform .15s,background .4s}
.go:active{transform:scale(.96)}
.sec{padding:14px 18px;border-radius:99px;border:1px solid var(--line);font-weight:500;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;margin-top:18px}
.seg button{padding:6px 14px;border-radius:99px;color:var(--mut);font-size:13px;font-weight:500}
.seg button.on{background:var(--soft);color:var(--ink)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.st{padding:16px}.st b{display:block;font:700 24px var(--f1)}.st span{color:var(--mut);font-size:13px}
.bar{height:7px;border-radius:9px;background:var(--line);margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .5s}
h2{font:700 18px var(--f1);margin:26px 0 12px}
.week{display:flex;gap:8px;align-items:flex-end;height:110px}
.week div{flex:1;text-align:center;font-size:12px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:6px}
.week i{display:block;background:var(--acc);border-radius:8px;min-height:4px;opacity:.85}
.list{display:grid;gap:10px}
.m{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.m.me1{border-color:var(--acc)}
.m .n{flex:1;min-width:0}.m .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m small{color:var(--mut)}.m .t{font:700 16px var(--f1);text-align:right}.pos{width:26px;text-align:center;font:700 15px var(--f1);color:var(--mut)}
.live{color:#16a34a}
.empty{text-align:center;color:var(--mut);padding:34px 10px}
.add{display:flex;gap:8px;margin-top:12px}
input[type=text],input[type=number],textarea{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg)}
.mini{padding:11px 18px;border-radius:14px;background:var(--acc);color:#fff;font-weight:600}
dialog{border:0;border-radius:var(--r);padding:24px;width:min(420px,92vw);background:var(--card);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,10,24,.55);backdrop-filter:blur(3px)}
dialog label{display:block;margin:14px 0 6px;font-weight:600;font-size:14px}
.cols{display:flex;gap:8px;flex-wrap:wrap}.cols button{width:30px;height:30px;border-radius:50%;border:3px solid transparent}.cols button.on{border-color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.ghost{padding:10px 14px;border-radius:12px;border:1px solid var(--line);font-weight:500}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;z-index:9;font-weight:500;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
.hint{color:var(--mut);font-size:13px;text-align:center;margin-top:10px}
nav button{font-size:14px}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.goal b{font:700 22px var(--f1)}.goal small{display:block;color:var(--mut);margin-top:8px;min-height:38px}
.goal label{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--mut)}.goal input{width:70px;padding:6px 10px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dist{display:grid;gap:14px}.dist div div{display:flex;justify-content:space-between;font-weight:500}.dist small{color:var(--mut)}
.hd{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}.hd h2{margin:0}.hd .seg{margin:0}
.ses{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.ses:last-child{border:0}.ses small{color:var(--mut)}
.fc{padding:16px;margin-bottom:10px}.fc.me1{border-color:var(--acc)}
.m0{display:flex;gap:12px;align-items:center}.m0 .n{flex:1;min-width:0}.m0 .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.el{font:700 20px var(--f1);color:#16a34a;font-variant-numeric:tabular-nums}
.m0 small{display:block;color:var(--mut)}.m0 small.live{color:#16a34a}
.fs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.fs b{display:block;font:700 15px var(--f1)}.fs span{color:var(--mut);font-size:12px}
.gh{font:700 15px var(--f1);color:var(--mut);margin:20px 0 10px}
.bd{display:inline-block;min-width:18px;padding:0 5px;border-radius:99px;background:#22c55e;color:#fff;font-size:11px;line-height:18px;margin-left:4px}
.chat{display:flex;flex-direction:column;height:min(62vh,560px);min-height:320px;padding:0}
.cl{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:16px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:86%}.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.msg .av{width:26px;height:26px;font-size:12px}
.bb{background:var(--bg);border-radius:16px;padding:8px 12px;min-width:0}.mine .bb{background:var(--acc);color:#fff}
.bb small{display:block;font-size:11px;color:var(--mut)}.mine .bb small{color:rgba(255,255,255,.8)}
.bb p{white-space:pre-wrap;word-break:break-word}
.lk{font-size:11px;color:inherit;opacity:.75;text-decoration:underline;margin-left:6px}
.cin{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
@media(max-width:480px){.goals{grid-template-columns:1fr}}
@media(max-width:480px){.row{grid-template-columns:1fr 1fr}.row .st:first-child{grid-column:span 2}.me span{display:none}.me{padding:4px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.vt{width:15px;height:15px;vertical-align:-2px;margin-left:4px;flex:none}

/* ---------- Rachas (fuego) ---------- */
.fl{width:1em;height:1em;vertical-align:-.15em;flex:none;display:inline-block}
.fl.off{filter:grayscale(1);opacity:.45}
.stk{display:inline-flex;align-items:center;gap:3px;padding:3px 9px 3px 6px;border-radius:99px;background:rgba(249,115,22,.14);color:#ea580c;font:700 13px var(--f1);flex:none;font-variant-numeric:tabular-nums}
:root[data-t=dark] .stk{color:#fb923c}
.fire{position:relative;overflow:hidden}
.fire>*{position:relative;z-index:1}
.fire>.bgf{position:absolute;z-index:0;right:-14px;top:50%;width:auto;height:170%;aspect-ratio:1;transform:translateY(-50%) rotate(8deg);opacity:var(--fo,.12);pointer-events:none}
.stn{color:var(--mut);font-size:12px;margin-top:6px;line-height:1.35}
.fire.fb{border-color:color-mix(in srgb,#f97316 calc(var(--fl,0)*100%),var(--line));box-shadow:0 0 0 calc(var(--fl,0)*1.5px) color-mix(in srgb,#f97316 calc(var(--fl,0)*100%),transparent),0 0 calc(var(--fl,0)*22px) calc(var(--fl,0)*2px) rgba(249,115,22,calc(.12 + var(--fl,0)*.4))}
.fire.max{animation:flick 1.6s ease-in-out infinite alternate}
@keyframes flick{to{box-shadow:0 0 0 1.5px #f97316,0 0 30px 5px rgba(251,146,60,.7)}}
@media(prefers-reduced-motion:reduce){.fire.max{animation:none}}

/* ---------- Tren de Anàlisi ---------- */
.train{padding:16px 14px 14px;margin-bottom:10px;overflow-x:auto;overflow-y:hidden;border-color:#f43f5e55}
.train h3{font:700 13px var(--f1);color:var(--mut);display:flex;justify-content:space-between;gap:8px}
.trk{display:flex;align-items:flex-end;width:max-content;min-width:100%;padding:58px 4px 10px;position:relative}
.trk::before{content:'';position:absolute;left:0;right:0;bottom:8px;height:3px;background:var(--mut);opacity:.7;border-radius:2px}
.trk::after{content:'';position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(90deg,#92400e 0 9px,transparent 9px 24px);opacity:.55;animation:gnd .45s linear infinite}
@keyframes gnd{to{background-position-x:-24px}}
.car{position:relative;width:112px;height:128px;flex:none;margin-right:10px;animation:bob .5s ease-in-out infinite alternate;animation-delay:calc(var(--i,0)*-.17s)}
.car:first-child{margin-left:auto}
@keyframes bob{to{transform:translateY(-1.5px)}}
.car:not(.loco)::after{content:'';position:absolute;right:-10px;top:96px;width:10px;height:5px;background:#475569;border-radius:2px}
.cb{position:absolute;left:0;right:0;top:0;height:110px;background:#f43f5e;border-radius:10px 10px 4px 4px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.16)}
.cb::before,.cab::before{content:'';position:absolute;left:-3px;right:-3px;top:-5px;height:9px;border-radius:6px;background:#9f1239}
.cb::after,.cab::after{content:'';position:absolute;left:0;right:0;bottom:18px;height:4px;background:rgba(255,255,255,.45)}
.cw{position:absolute;left:8px;right:8px;top:14px;bottom:24px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.55);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#fff;text-align:center;z-index:1}
.cw .av{width:32px;height:32px;font-size:14px;border:2px solid #fff;overflow:visible}
.cw .av::after{display:none}
.cw b{font:700 12px var(--f1);max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center}
.cw .vt{width:12px;height:12px}
.cw .el{color:#fff;font-size:12px;line-height:1.2}
.cw small{font-size:10px;line-height:1.2;opacity:.92}
.ch{position:absolute;left:4px;right:4px;top:108px;height:8px;background:#1e293b;border-radius:3px}
.wl{position:absolute;bottom:0;width:24px;height:24px;animation:spin .9s linear infinite}
.w1{left:12px}.w2{right:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loco{width:210px}
.loco .ch{right:16px}
.cab{position:absolute;left:0;top:0;width:90px;height:110px;background:#be123c;border-radius:8px 4px 4px 4px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.18)}
.cab .cw{top:20px;bottom:14px}
.boiler{position:absolute;left:86px;top:40px;width:104px;height:62px;border-radius:4px 30px 30px 4px;background:repeating-linear-gradient(90deg,transparent 0 30px,rgba(0,0,0,.22) 30px 33px),linear-gradient(#e11d48,#9f1239);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.chim{position:absolute;left:150px;top:16px;width:18px;height:28px;background:#1e293b}
.chim::before{content:'';position:absolute;left:-4px;right:-4px;top:-5px;height:7px;border-radius:3px;background:#1e293b}
.dome{position:absolute;left:108px;top:28px;width:22px;height:16px;background:#fbbf24;border-radius:11px 11px 0 0}
.lamp{position:absolute;left:188px;top:56px;width:10px;height:14px;background:#fde047;border-radius:0 8px 8px 0;box-shadow:0 0 12px #fde047}
.catch{position:absolute;left:180px;top:100px;width:30px;height:24px;background:#1e293b;clip-path:polygon(0 0,100% 100%,0 100%)}
.loco .wl{width:34px;height:34px}
.loco .w1{left:14px;right:auto}.loco .w2{left:64px;right:auto}.loco .w3{left:136px;right:auto;width:26px;height:26px}
.rod{position:absolute;left:31px;top:109px;width:50px;height:4px;background:#cbd5e1;border-radius:2px;animation:rod .9s linear infinite;z-index:2}
@keyframes rod{0%{transform:translate(0,-11px)}25%{transform:translate(11px,0)}50%{transform:translate(0,11px)}75%{transform:translate(-11px,0)}}
.smk{position:absolute;left:159px;top:6px;width:0;height:0}
.pf{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--mut);opacity:0;animation:puff 2.4s ease-out infinite}
.pf:nth-child(2){animation-delay:.8s}.pf:nth-child(3){animation-delay:1.6s}
@keyframes puff{0%{transform:translate(0,0) scale(.5);opacity:.6}100%{transform:translate(-34px,-40px) scale(1.9);opacity:0}}
.hat{position:absolute;left:50%;top:-16px;width:30px;height:21px;transform:translateX(-50%) rotate(-6deg);z-index:3;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.seat{width:32px;height:32px;border-radius:50%;border:2px dashed rgba(255,255,255,.7);display:grid;place-items:center;font-size:14px}
@media(prefers-reduced-motion:reduce){.train *,.trk::after{animation:none!important}}
</style>

<script>

const fbCfg={apiKey:"AIzaSyDtBjHqSx7QyJZXlR7EsYAPmTadIu2hmnU",authDomain:"math-study-df821.firebaseapp.com",databaseURL:"https://math-study-df821-default-rtdb.europe-west1.firebasedatabase.app",projectId:"math-study-df821",storageBucket:"math-study-df821.firebasestorage.app",messagingSenderId:"278188701491",appId:"1:278188701491:web:703b085ecc312d0f9ef046"};
const blank=()=>({theme:'light',view:'study',sel:'fonaments',mode:'free',rank:'daily',gv:'friends',range:7,nick:'',color:COLORS[0],goalD:3,goalW:15,
  tot:{fonaments:0,algebra:0,analisi:0},hist:{},sess:[],
  run:null,cur:0,phase:0,rem:POMO[0]});
let S=blank(),last=0,loop=null,tick5=0,saveT=0;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NCH='A-Za-z0-9ÀÁÂÃÄÅÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜÝàáâãäåçèéêëìíîïñòóôõöùúûüýÿ',NICK_RE=new RegExp('^['+NCH+']+(?: ['+NCH+']+)*$');
const nickKey=n=>String(n).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/ /g,'');
function nickErr(n){
  if(n.length<3||n.length>20)return 'El nombre debe tener entre 3 y 20 caracteres';
  if(!NICK_RE.test(n))return 'Solo letras, números y espacios (sin emojis ni símbolos)';
  if(!/^[a-z0-9]{3,20}$/.test(nickKey(n)))return 'Mínimo 3 caracteres sin contar los espacios';
  return '';
}
const num=(v,max=1e9)=>Math.min(max,Math.max(0,Math.floor(+v||0)));
const dk=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const monday=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
const hm=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h} h ${m} min`:`${m} min`};
const clock=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,'0');return (h?h+':':'')+p(m)+':'+p(x)};
const day=k=>S.hist[k]?.t||0;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---------- Persistencia (con migración de la v1 y validación) ---------- */
function clean(p){
  const b=blank(),o=p&&typeof p==='object'?p:{};
  b.theme=o.theme==='dark'?'dark':'light';
  b.nick=String(o.nick??o.userProfile?.nickname??'').trim().slice(0,20);
  b.color=COLORS.includes(o.color??o.userProfile?.avatarColor)?(o.color??o.userProfile.avatarColor):COLORS[0];
  b.goalD=Math.min(24,num(o.goalD??o.dailyGoalHours)||3);b.goalW=Math.min(168,num(o.goalW??o.weeklyGoalHours)||15);
  b.sel=IDS.includes(o.sel)?o.sel:'fonaments';b.range=o.range===30?30:7;b.mode=o.mode==='pomo'?'pomo':'free';
  IDS.forEach(i=>{
    b.tot[i]=num(o.tot?.[i]??o.subjects?.[i]?.totalSeconds);
  });
  const h=o.hist??o.dailyHistory;
  if(h&&typeof h==='object')Object.keys(h).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).forEach(k=>{
    const e={t:0};IDS.forEach(i=>{e[i]=num(h[k]?.[i],86400);e.t+=e[i]});if(e.t)b.hist[k]=e});
  b.sess=(Array.isArray(o.sess??o.sessions)?(o.sess??o.sessions):[]).map(x=>({s:x.s??x.subjectId,d:num(x.d??x.durationSeconds,86400),at:x.at??(Date.parse(x.dateISO)||0),n:String(x.n??x.note??'').slice(0,60)})).filter(x=>IDS.includes(x.s)&&x.d>0).slice(0,50);
  return b;
}
function load(){let r;try{r=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLD))}catch(e){}S=clean(r)}
function save(now){clearTimeout(saveT);const go=()=>{try{localStorage.setItem(KEY,JSON.stringify({...S,run:null}))}catch(e){}};now?go():saveT=setTimeout(go,3000)}
addEventListener('pagehide',()=>{save(true);sync(true,true)});
document.addEventListener('visibilitychange',()=>syncListeners());
/* Varias pestañas: la que arranca el cronómetro manda; las demás se actualizan y se pausan. */
addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;const v=S.view;load();S.view=v;stop();render();sync()});

/* ---------- Tiempo ---------- */
function addTime(id,d){
  S.tot[id]+=d;const k=dk(),e=S.hist[k]||(S.hist[k]={t:0,fonaments:0,algebra:0,analisi:0});e[id]+=d;e.t+=d;
}
function tick(){
  const now=Date.now(),d=Math.floor((now-last)/1000);if(d<1||!S.run)return;last+=d*1000;
  if(S.mode==='free'){S.cur+=d;addTime(S.run,d)}
  else{S.rem-=d;if(S.phase===0){S.cur+=d;addTime(S.run,d)}
    if(S.rem<=0){bell();if(S.phase===0){endSession('Pomodoro');S.phase=1;S.rem=POMO[1];toast('Pomodoro completado. Descansa 10 minutos.')}
      else{S.phase=0;S.rem=POMO[0];S.run=null;stop();toast('Descanso terminado.');render()}}}
  paint();if(++tick5%30===0)sync();save();
}
function start(){if(!loop){last=Date.now();loop=setInterval(tick,300)}}
function stop(){clearInterval(loop);loop=null;S.run=null}
function toggle(){
  if(S.run){stop();toast('Pausado')}
  else{load2();S.run=S.sel;start()}
  render();sync(true);save(true);
}
function load2(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r){const o=clean(r);S.tot=o.tot;S.hist=o.hist;S.sess=o.sess}}catch(e){}}
function endSession(note){if(S.cur>=10){S.sess.unshift({s:S.run||S.sel,d:S.cur,at:Date.now(),n:note});S.sess=S.sess.slice(0,50)}S.cur=0}
function finish(){const had=S.cur;stop();endSession(S.mode==='pomo'?'Pomodoro':'Libre');if(had>=10)toast('Sesión guardada: '+hm(had));S.phase=0;S.rem=POMO[0];render();sync(true);save(true)}
function bell(){try{const a=new(window.AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+1.4);o.start();o.stop(a.currentTime+1.5)}catch(e){}}

/* ---------- Estadísticas ---------- */
function stats(){
  const k=dk(),m=monday();let w=0;
  Object.entries(S.hist).forEach(([d,v])=>{const[y,mo,da]=d.split('-').map(Number);if(new Date(y,mo-1,da)>=m)w+=v.t});
  return{total:IDS.reduce((a,i)=>a+S.tot[i],0),today:day(k),todayKey:k,week:w,weekKey:dk(m)};
}
/* Racha: un día suma si se estudia al menos 1 hora (QUAL). Si hoy aún no llegas a 1 h, la racha no se pierde: cuenta hasta ayer. */
const QUAL=3600,dias=n=>n+(n===1?' día':' días');
function streakCur(){
  let n=0;const d=new Date();if(day(dk(d))<QUAL)d.setDate(d.getDate()-1);
  const end=dk(d);while(day(dk(d))>=QUAL){n++;d.setDate(d.getDate()-1)}
  return{n,end:n?end:''};
}
function streakBest(cur){
  let best=0,run=0,prev=null;
  Object.keys(S.hist).filter(k=>S.hist[k].t>=QUAL).sort().forEach(k=>{
    const[y,m,d]=k.split('-').map(Number),t=Date.UTC(y,m-1,d);
    run=prev!==null&&t-prev===864e5?run+1:1;prev=t;if(run>best)best=run});
  return Math.max(best,cur);
}
/* La racha guardada de otra persona solo vale si su último día contado es hoy o ayer. */
function liveStreak(u){
  const y=new Date();y.setDate(y.getDate()-1);
  return u.streakEnd===dk()||u.streakEnd===dk(y)?num(u.streak,36500):0;
}
const FL='<svg class="fl" viewBox="0 0 24 24" aria-hidden="true"><use href="#flame"/></svg>';
const fireBg=n=>n>0?'<svg class="bgf" viewBox="0 0 24 24" aria-hidden="true"><use href="#flame"/></svg>':'';
/* Fuego: de 1 a 4 días solo una llama tenue; desde el día 5 aparece el borde brillante y crece hasta el máximo en el día 30. */
const FIRE_MIN=5,FIRE_MAX=30;
const fireLv=n=>n<FIRE_MIN?0:Math.min(1,.25+.75*(n-FIRE_MIN)/(FIRE_MAX-FIRE_MIN));
const fireCls=n=>n>0?' fire'+(n>=FIRE_MIN?' fb':'')+(n>=FIRE_MAX?' max':''):'';
const fireVar=n=>n>0?`--fo:${(n<FIRE_MIN?.08:.12+.2*fireLv(n)).toFixed(2)};--fl:${fireLv(n).toFixed(2)}`:'';

/* ---------- Firebase (comunidad) ---------- */
let fb={ok:false,db:null,rt:null,uid:'',users:{},pres:{},ver:new Set(),docOk:false},lastFs=0,lastFsSig='',lastProf='',lastPrSig='',unsubFs=null,off=0,ringPrev=0;
async function initFb(){
  try{
    if(typeof firebase==='undefined')throw 0;
    firebase.apps.length||firebase.initializeApp(fbCfg);
    const au=firebase.auth();fb.db=firebase.firestore();fb.rt=firebase.database();
    const u=await new Promise((r,j)=>{const x=au.onAuthStateChanged(v=>{x();r(v)},j)});
    if(!u)await au.signInAnonymously();
    fb.uid=au.currentUser.uid;fb.ok=true;fetchVerified();if(S.nick)await checkNick();fb.rt.ref('.info/serverTimeOffset').on('value',s=>{off=s.val()||0});
    fb.rt.ref('.info/connected').on('value',s=>{if(s.val()){
      fb.rt.ref('presence/'+fb.uid).onDisconnect().update({online:false,lastSeen:firebase.database.ServerValue.TIMESTAMP,active:null,since:null}).catch(()=>{});lastPrSig='';sync(true)}});
    fb.rt.ref('presence').on('value',s=>{fb.pres=s.val()||{};if(S.view==='group'&&S.gv!=='chat')render();else badge()});
    syncListeners();badge();setTimeout(prune,8000);
  }catch(e){fb.ok=false;console.warn('Modo local:',e)}
}
/* Verificación: campo estaVerificado en Firestore (users/{uid}). Solo se cambia a mano en la consola. */
const TICK='<svg class="vt" viewBox="0 0 24 24" role="img" aria-label="Verificado"><title>Verificado</title><circle cx="12" cy="12" r="11" fill="#1d9bf0"/><path d="M7 12.4l3.2 3.2L17 8.8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const isVer=uid=>!!uid&&fb.ver.has(uid);
let verAt=0;
async function fetchVerified(){
  if(!fb.ok||Date.now()-verAt<3e5)return;verAt=Date.now();
  try{
    const sn=await fb.db.collection('users').where('estaVerificado','==',true).get(),n=new Set();sn.forEach(d=>n.add(d.id));
    const ch=n.size!==fb.ver.size||[...n].some(x=>!fb.ver.has(x));fb.ver=n;
    if(ch){hdr();if(S.view==='group'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName))render()}
  }catch(e){console.warn('Verificados:',e.message)}
}
/* Escribe el perfil; al crearlo (o si el documento es antiguo) fija estaVerificado=false. Nunca lo envía si ya existe. */
async function writeProfile(data){
  const ref=fb.db.collection('users').doc(fb.uid);
  if(!fb.docOk){const sn=await ref.get();if(!sn.exists||sn.data().estaVerificado===undefined)data.estaVerificado=false;fb.docOk=true}
  return ref.set(data,{merge:true});
}
/* Nombres únicos: nicks/{nombre en minúsculas sin acentos ni espacios} = {uid,nick,ts}. Un nombre sin tocar durante 30 días queda libre. */
async function claimNick(n){
  const ref=fb.rt.ref('nicks/'+nickKey(n));
  try{
    const cur=(await ref.once('value')).val();
    if(cur&&cur.uid!==fb.uid&&sNow()-(+cur.ts||0)<30*864e5)return 'taken';
    await ref.set({uid:fb.uid,nick:n,ts:firebase.database.ServerValue.TIMESTAMP});return 'ok';
  }catch(e){
    try{const c=(await ref.once('value')).val();if(c&&c.uid!==fb.uid)return 'taken'}catch(x){}
    return 'error';
  }
}
function releaseNick(old,keep){
  if(!fb.ok||!old)return;const k=nickKey(old);
  if(!/^[a-z0-9]{3,20}$/.test(k)||(keep&&nickKey(keep)===k))return;
  fb.rt.ref('nicks/'+k).remove().catch(()=>{});
}
async function checkNick(){
  let bad=nickErr(S.nick);
  if(!bad&&await claimNick(S.nick)==='taken')bad='uso';
  if(!bad)return;
  S.nick='';save(true);lastPrSig='';lastProf='';
  fb.rt.ref('presence/'+fb.uid+'/nickname').remove().catch(()=>{});
  writeProfile({nickname:''}).catch(()=>{});
  render();toast('Tu nombre no es válido o ya está en uso. Elige otro.');settings();
}
/* Firestore solo se LEE con la pestaña Comunidad abierta y solo usuarios activos en los últimos 30 días. */
function listenUsers(on){
  if(!fb.ok)return;
  if(on&&!unsubFs){
    unsubFs=fb.db.collection('users').where('updatedAt','>',Date.now()-30*864e5).onSnapshot(s=>{
      s.docChanges().forEach(c=>{c.type==='removed'?delete fb.users[c.doc.id]:fb.users[c.doc.id]=c.doc.data()});
      if(S.view==='group'&&document.activeElement.tagName!=='INPUT')render();
    },e=>{console.warn('Firestore:',e);unsubFs=null});
  }else if(!on&&unsubFs){unsubFs();unsubFs=null}
}
/* Escrituras mínimas:
   - Presencia (Realtime DB): solo cuando cambia tu estado (empezar, pausar, perfil). Sin latidos periódicos.
   - Estadísticas (Firestore): al pausar, al cerrar, o cada 5 min mientras estudias; y nunca si no han cambiado. */
function sync(force,final){
  if(!fb.ok||!S.nick)return;
  const now=Date.now(),st=stats(),a=S.run?SUBJ[S.run].n:null;
  const ps=JSON.stringify([S.nick,S.color,a]);
  if(ps!==lastPrSig){lastPrSig=ps;
    fb.rt.ref('presence/'+fb.uid).update({online:true,lastSeen:firebase.database.ServerValue.TIMESTAMP,nickname:S.nick,avatarColor:S.color,active:a,since:S.run?now+off-S.cur*1000:null}).catch(()=>{})}
  const sk=streakCur(),bs=streakBest(sk.n);
  const fs=JSON.stringify([S.nick,S.color,Math.floor(st.total/60),Math.floor(st.today/60),Math.floor(st.week/60),sk.n,sk.end,bs]);
  if(fs===lastFsSig)return;
  const prof=S.nick+S.color,due=lastFs===0||final||prof!==lastProf||(!S.run&&force)||now-lastFs>=300000;
  if(!due)return;
  lastFs=now;lastFsSig=fs;lastProf=prof;
  writeProfile({nickname:S.nick,avatarColor:S.color,totalSeconds:st.total,todaySeconds:st.today,todayDateKey:st.todayKey,weeklySeconds:st.week,weekStartKey:st.weekKey,streak:sk.n,streakEnd:sk.end,bestStreak:bs,updatedAt:now+off}).catch(()=>{});
}
function members(){
  const tk=dk(),wk=dk(monday()),now=Date.now(),out=[];
  new Set([...Object.keys(fb.users),...Object.keys(fb.pres)]).forEach(id=>{
    const me=id===fb.uid,u={...fb.users[id],...fb.pres[id]};
    if(me&&S.nick){const st=stats(),sk=streakCur();Object.assign(u,{streak:sk.n,streakEnd:sk.end,bestStreak:streakBest(sk.n),nickname:S.nick,avatarColor:S.color,totalSeconds:st.total,todaySeconds:st.today,todayDateKey:tk,weeklySeconds:st.week,weekStartKey:wk,online:fb.ok,active:S.run?SUBJ[S.run].n:null,since:S.run?now+off-S.cur*1000:null,lastSeen:now,updatedAt:now})}
    if(!u.nickname||!NICK_RE.test(String(u.nickname)))return;
    if(!u.online&&now-(u.updatedAt||0)>30*864e5)return;           // usuarios fantasma
    const extra=(!me&&u.online&&u.active)?Math.min(600,Math.max(0,(now+off-(Math.max(+u.updatedAt||0,+u.since||0)||now+off))/1000)):0; // frescura de datos ajenos
    out.push({id,me,nick:String(u.nickname).slice(0,20),color:COLORS.includes(u.avatarColor)?u.avatarColor:COLORS[0],on:!!u.online,act:u.online?u.active:null,since:+u.since||0,seen:+u.lastSeen||+u.updatedAt||0,
      daily:(u.todayDateKey===tk?num(u.todaySeconds,86400):0)+extra,weekly:(u.weekStartKey===wk?num(u.weeklySeconds):0)+extra,total:num(u.totalSeconds)+extra,
      streak:liveStreak(u),best:Math.max(num(u.bestStreak,36500),liveStreak(u))});
  });return out;
}
function badge(){const on=members().filter(m=>m.on&&!m.me).length,b=$('#nav [data-v=group]');if(b)b.innerHTML='Comunidad'+(on?`<span class="bd">${on}</span>`:'')}

/* ---------- Interfaz ---------- */
function setAcc(){const r=document.documentElement;r.dataset.t=S.theme;r.style.setProperty('--acc',SUBJ[S.sel].c);$('#thm').textContent=S.theme==='dark'?'☀︎':'☾'}
function paint(){
  const st=stats(),g=S.goalD*3600,t=$('#tm');if(!t)return;
  t.textContent=clock(S.mode==='free'?S.cur:S.rem);
  const circ=2*Math.PI*45,frac=ringFrac(),pg=$('#pg');
  if(frac<ringPrev){pg.style.transition='none';pg.style.strokeDashoffset=circ*(1-frac);pg.getBoundingClientRect();pg.style.transition=''}
  else pg.style.strokeDashoffset=circ*(1-frac);
  pg.style.strokeOpacity=frac>.002?1:0;ringPrev=frac;
  $('#sub').textContent=S.mode==='pomo'&&S.phase?'Descanso':(S.run?'Estudiando '+SUBJ[S.run].n:'Sesión de hoy');
  $('#v-today').textContent=hm(st.today);$('#gbar').style.width=Math.min(100,st.today/g*100)+'%';
  $('#gtxt').textContent=`${Math.round(Math.min(100,st.today/g*100))}% de tu meta de ${S.goalD} h`;
  $('#v-week').textContent=hm(st.week);$('#v-sel').textContent=hm(S.tot[S.sel]);
  const sk=streakCur(),rest=Math.ceil((QUAL-st.today)/60);
  $('#v-streak').textContent=dias(sk.n);$('#stk-ico').classList.toggle('off',!sk.n);
  const kc=$('#stk-card');kc.style.cssText=fireVar(sk.n);kc.className='card st fire'+(sk.n>=FIRE_MIN?' fb':'')+(sk.n>=FIRE_MAX?' max':'');
  $('#stk-note').textContent=st.today>=QUAL?'Hoy ya suma a tu racha.':`Estudia ${rest} min más hoy para ${sk.n?'mantenerla':'empezarla'}.`;
  if(((S.view==='group'&&S.gv!=='chat')||S.view==='stats')&&tick5%10===0&&document.activeElement.tagName!=='INPUT')render();
}
const ringFrac=()=>S.mode==='free'?(S.cur%60)/60:1-S.rem/POMO[S.phase];
function study(){
  const circ=2*Math.PI*45,f0=ringFrac();ringPrev=f0;
  return `<div class="card focus">
  <div class="chips">${IDS.map(i=>`<button class="chip ${i===S.sel?'on':''}" data-sub="${i}"><b style="background:${SUBJ[i].c}"></b>${SUBJ[i].n}</button>`).join('')}</div>
  <div class="ring"><svg viewBox="0 0 100 100"><circle class="tr" cx="50" cy="50" r="45" style="stroke-width:5"/><circle class="pg" id="pg" cx="50" cy="50" r="45" style="stroke-width:5;stroke-dasharray:${circ};stroke-dashoffset:${circ*(1-f0)};stroke-opacity:${f0>.002?1:0}"/></svg>

function weekChart(){

}

  <div class="card"><div class="week" style="gap:${n>7?3:8}px">${ds.map((d,i)=>`<div title="${hm(vals[i])}"><i style="height:${vals[i]/mx*100}%;opacity:${vals[i]>=gD?1:.4}"></i>${n===7?'DLMXJVS'[d.getDay()]:(i%5===4?d.getDate():'')}</div>`).join('')}</div>

const sNow=()=>Date.now()+off;
const ago=t=>{if(!t)return 'hace tiempo';const x=Math.max(0,(sNow()-t)/1000);if(x<60)return 'hace un momento';if(x<3600)return 'hace '+Math.floor(x/60)+' min';if(x<86400)return 'hace '+Math.floor(x/3600)+' h';return 'hace '+Math.floor(x/86400)+' d'};

/* ---------- Tren: quien estudia Anàlisi va en un vagón; el top 1 semanal conduce (a la derecha) y lleva sombrero.
   Los vagones se ordenan por tiempo total: más tiempo, más cerca de la locomotora. ---------- */
const HAT='<svg class="hat" viewBox="0 0 34 24" aria-label="Sombrero de maquinista"><path d="M5 15C5 6 11 2 17 2s12 4 12 13z" fill="#1e293b"/><rect x="4" y="12" width="26" height="4" rx="1.5" fill="#fbbf24"/><path d="M3 16h28c0 4-4 6-14 6S3 20 3 16z" fill="#0f172a"/><circle cx="17" cy="8" r="2.4" fill="#fbbf24"/></svg>';
const WHEEL=c=>`<svg class="wl ${c}" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/><path d="M12 2v20M2 12h20" stroke="#94a3b8" stroke-width="1.4"/><circle cx="12" cy="12" r="3" fill="#94a3b8"/><circle cx="12" cy="4.5" r="1.8" fill="#fbbf24"/></svg>`;
let trainR=0;
function fixTrain(){const t=document.querySelector('.train');if(t)t.scrollLeft=Math.max(0,t.scrollWidth-t.clientWidth-trainR)}
document.addEventListener('scroll',e=>{const t=e.target;if(t&&t.classList&&t.classList.contains('train'))trainR=Math.max(0,t.scrollWidth-t.clientWidth-t.scrollLeft)},true);
function trainBlock(ms,all){
  const AN=SUBJ.analisi.n,top=[...all].sort((a,b)=>b.weekly-a.weekly)[0],topId=top&&top.weekly>0?top.id:null;
  const pas=ms.filter(m=>m.act===AN);if(!pas.length)return '';
  const drv=pas.find(m=>m.id===topId),rest=pas.filter(m=>m!==drv).sort((a,b)=>a.total-b.total);
  const cell=(m,d,x)=>`<div class="av ${m.on?'on':''}" style="background:${m.color}">${esc(m.nick[0].toUpperCase())}${d?HAT:''}</div>
    <b>${esc(m.nick)}${isVer(m.id)?TICK:''}${m.me?' (tú)':''}</b>${m.since?`<div class="el" data-s="${m.since}">${clock((sNow()-m.since)/1000)}</div>`:''}<small>${x}</small>`;
  const wagons=rest.map((m,k)=>`<div class="car" style="--i:${k}"><div class="cb"><div class="cw">${cell(m,false,'Total '+hm(m.total))}</div></div><i class="ch"></i>${WHEEL('w1')}${WHEEL('w2')}</div>`).join('');
  const cab=drv?cell(drv,true,'Maquinista · top 1'):'';
  const loco=`<div class="car loco" style="--i:${rest.length}"><div class="smk"><i class="pf"></i><i class="pf"></i><i class="pf"></i></div><div class="cab"><div class="cw">${cab}</div></div><div class="boiler"></div><i class="chim"></i><i class="dome"></i><i class="lamp"></i><i class="catch"></i><i class="ch"></i><i class="rod"></i>${WHEEL('w1')}${WHEEL('w2')}${WHEEL('w3')}</div>`;
  return `<div class="card train"><h3><span>🚆 Tren de ${esc(AN)}</span><span>${pas.length} a bordo</span></h3><div class="trk">${wagons}${loco}</div><div class="hint">Más tiempo total, más cerca de la locomotora. Conduce el top 1 semanal.</div></div>`;
}
function group(){
  const ms=members();let h=`<div class="seg" style="margin:0 0 14px"><button data-gv="friends" class="${S.gv==='friends'?'on':''}">Amigos</button><button data-gv="rank" class="${S.gv==='rank'?'on':''}">Ranking</button><button data-gv="chat" class="${S.gv==='chat'?'on':''}">Chat</button></div>`;
  if(!S.nick)h+=`<div class="card" style="margin-bottom:14px;text-align:center">Elige un nombre para que tus amigos te vean.<div class="ctl"><button class="mini" data-open="1">Elegir nombre</button></div></div>`;
  if(!fb.ok)h+=`<div class="hint" style="margin-bottom:10px">Sin conexión: la comunidad no está disponible, pero tu cronómetro funciona igual.</div>`;

  if(S.gv==='friends'){
    const by=(a,k)=>a.sort((x,y)=>y[k]-x[k]),act=by(ms.filter(m=>m.act),'daily'),onl=by(ms.filter(m=>m.on&&!m.act),'daily'),off=by(ms.filter(m=>!m.on),'seen');

    if(ms.filter(m=>!m.me).length===0)h+=`<div class="empty">Aún no hay amigos aquí.<br>Comparte el enlace de la app: aparecerán en cuanto pongan su nombre.</div>`;

  h+=ms.length?`<div class="list">${ms.map((m,i)=>`<div class="m ${m.me?'me1':''}${fireCls(m.streak)}" style="${fireVar(m.streak)}">${fireBg(m.streak)}<div class="pos">${(!sr||m.streak>0)&&['🥇','🥈','🥉'][i]||i+1}</div>
  <div class="av ${m.on?'on':''}" style="background:${m.color}">${esc(m.nick[0].toUpperCase())}</div>
  <div class="n"><b>${esc(m.nick)}${isVer(m.id)?TICK:''}${m.me?' (tú)':''}</b><small class="${!sr&&m.act?'live':''}">${sr?'Récord: '+dias(m.best):m.act?'Estudiando '+esc(m.act):m.on?'En línea':'Visto '+ago(m.seen)}</small></div><div class="t">${sr?FL+' '+dias(m.streak):hm(m[S.rank])}</div></div>`).join('')}</div>${sr?'<div class="hint">Ranking por racha actual. Un día suma si estudias 1 h o más. El borde de fuego aparece en el día 5 y llega al máximo en el día 30.</div>':''}`
    :`<div class="empty">Todavía no hay nadie en el ranking.<br>Empieza a estudiar y serás el primero.</div>`;
  return h;

/* ---------- Chat (Realtime Database; solo se escucha con el chat abierto; últimos 50 mensajes) ---------- */
let draft='',lastMsg=0,chatRef=null;
const hhmm=t=>{const d=new Date(t||Date.now());return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function bubble(m){
  const me=m.uid===fb.uid,col=COLORS.includes(m.color)?m.color:COLORS[0],nk=NICK_RE.test(String(m.nick))?String(m.nick):'Anónimo';
  return `<div class="msg ${me?'mine':''}" id="m_${esc(m.k)}"><div class="av" style="background:${col}">${esc(nk[0].toUpperCase())}</div>
  <div class="bb"><small>${me?'Tú':esc(nk)}${isVer(m.uid)?TICK:''} ${hhmm(m.ts)}${me?`<button class="lk" data-delm="${esc(m.k)}">borrar</button>`:''}</small><p>${esc(m.text)}</p></div></div>`;
}
function chatView(){
  const ms=fb.msgs||[];
  return `<div class="card chat"><div class="cl" id="cl">${ms.length?ms.map(bubble).join(''):'<div class="empty" id="ce">Aún no hay mensajes. Escribe el primero.</div>'}</div>
  <div class="cin"><input type="text" id="ci" maxlength="300" placeholder="Escribe un mensaje" autocomplete="off"><button class="mini" id="cs">Enviar</button></div></div>
  <div class="hint">Lo ven todos los usuarios de la app. Se muestran los últimos 50 mensajes.</div>`;
}
function chatAdd(m){
  const l=document.getElementById('cl');if(!l||S.view!=='group'||S.gv!=='chat')return;
  const near=l.scrollHeight-l.scrollTop-l.clientHeight<80||m.uid===fb.uid;
  document.getElementById('ce')?.remove();l.insertAdjacentHTML('beforeend',bubble(m));
  while(l.children.length>80)l.firstChild.remove();
  if(near)l.scrollTop=l.scrollHeight;
}
function listenChat(on){
  if(!fb.ok)return;
  if(on&&!chatRef){
    fb.msgs=[];chatRef=fb.rt.ref('chat/general').limitToLast(50);
    chatRef.on('child_added',x=>{const m={k:x.key,...x.val()};fb.msgs.push(m);if(fb.msgs.length>80)fb.msgs.shift();chatAdd(m)},e=>{console.warn('Chat:',e);chatRef=null});
    chatRef.on('child_removed',x=>{fb.msgs=fb.msgs.filter(m=>m.k!==x.key);document.getElementById('m_'+x.key)?.remove()});
  }else if(!on&&chatRef){chatRef.off();chatRef=null}
}
/* Limpieza sin servidor: una vez por visita se borran (máx. 50 de cada) los mensajes de más de 7 días y las presencias de más de 30. */
let pruned=false;
function prune(){
  if(!fb.ok||pruned)return;pruned=true;
  const run=(path,key,ms)=>fb.rt.ref(path).orderByChild(key).endAt(sNow()-ms-36e5).limitToFirst(50).once('value')
    .then(sn=>Promise.all(Object.keys(sn.val()||{}).filter(k=>path!=='presence'||k!==fb.uid).map(k=>fb.rt.ref(path+'/'+k).remove().catch(()=>{}))))
    .catch(e=>console.warn('Limpieza:',e.message));
  run('chat/general','ts',7*864e5);run('presence','lastSeen',30*864e5);
}
function syncListeners(){const g=S.view==='group'&&!document.hidden;if(g)fetchVerified();listenUsers(g&&S.gv!=='chat');listenChat(g&&S.gv==='chat')}
function sendMsg(){
  const i=$('#ci'),t=(i?i.value:'').trim().slice(0,300);
  if(!t)return;if(!S.nick)return settings();if(!fb.ok)return toast('Sin conexión con la comunidad');
  if(Date.now()-lastMsg<1500)return toast('Espera un segundo antes de enviar otro mensaje');
  lastMsg=Date.now();
  fb.rt.ref('chat/general').push({uid:fb.uid,nick:S.nick,color:S.color,text:t,ts:firebase.database.ServerValue.TIMESTAMP}).catch(()=>toast('No se pudo enviar. Revisa las reglas de Realtime Database.'));
  i.value='';draft='';
}

  if(q('#thm')){S.theme=S.theme==='dark'?'light':'dark';save(true);return render()}
});
document.addEventListener('change',e=>{const g=e.target.id;if(g==='qd'||g==='qw'){const mx=g==='qd'?24:168,v=Math.min(mx,Math.max(1,num(e.target.value)||1));g==='qd'?S.goalD=v:S.goalW=v;save(true);return render()}
  });
document.addEventListener('input',e=>{if(e.target.id==='ci')draft=e.target.value;});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='ci')sendMsg()});
document.addEventListener('visibilitychange',()=>{if(S.run){last=Date.now()-Math.min(Date.now()-last,864e5)}});

setInterval(()=>{if(S.view==='group'&&S.gv!=='chat'&&!S.run)render()},15000); // refresca 'hace X min' aunque tu cronómetro esté parado
setInterval(()=>document.querySelectorAll('.el[data-s]').forEach(e=>e.textContent=clock((sNow()-e.dataset.s)/1000)),1000);
load();render();initFb();
</script>
</body>
</html>
