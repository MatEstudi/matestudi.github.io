<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1020" media="(prefers-color-scheme: dark)">
  <meta name="description" content="MatEstudi: cronómetro de estudio, estadísticas y comunidad para estudiar matemáticas.">
  <title>MatEstudi</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views/study.css">
  <link rel="stylesheet" href="css/views/stats.css">
  <link rel="stylesheet" href="css/views/community.css">
  <link rel="stylesheet" href="css/views/chat.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo"><i aria-hidden="true">∑</i>MatEstudi</div>
      <div class="tools">
        <button class="me" id="me" aria-label="Perfil y ajustes"><span class="av" id="meav"></span><span id="mename"></span></button>
      </div>
    </header>
    <nav id="nav" aria-label="Secciones">
      <button data-v="study">Estudiar</button>
      <button data-v="stats">Estadísticas</button>
      <button data-v="group">Comunidad</button>
    </nav>
    <main id="main"></main>
  </div>
  <dialog id="dlg"></dialog>
  <div id="toast" role="status"></div>

  <!-- Firebase (compat build). Deferred scripts run in order, before the module below. -->
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
